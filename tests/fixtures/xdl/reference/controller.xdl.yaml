apiVersion: xverse.io/xdl/v1alpha1
kind: Component
metadata:
  namespace: org.xverse.studio.process-control
  name: reference-controller
  version: 1.0.0
  description: Studio-owned reference fixture.
  provenance:
    source: urn:xverse:studio:reference
    revision: 1.0.0
    maturity: prototype
    limitations:
    - Owned executable reference only; no external simulator, device or
      scientific fidelity claim.
spec:
  capabilities:
  - reference-control
  interfaces:
  - id: command
    direction: bidirectional
    payloadSchema: urn:xverse:studio:normalized-scalar:v1
    unitSemantics: '1'
    compatibility: exact
  endpoints:
  - id: command-out
    ownerId: reference-controller
    interfaceId: command
    direction: output
  parameters: []
